{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="{% static 'panoramas/estilos.css' %}">
</head>
<body>
    <header class="encabezado">
        <h1>Panoramas en Santiago</h1>
        <a href="{% url 'elegir_comuna' %}">← Volver al inicio</a>
    </header>

    <main class="contenedor">
        <section class="ficha">
            <h2>Crear cuenta</h2>
            <form method="post" class="formulario">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="boton">Registrarme</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
        </section>
    </main>
</body>
</html>
